name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 37  # PS-3.4/PSC-9 (platform-supply-chain): green CI runs 39713504156 (24.5 min) and 39713519072 (23.0 min); slower run + 50% = 36.75 -> 37 min, see docs/evidence/platform-supply-chain/ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The same entry point as local and agent runs: it builds the `gates`
      # image. Unit tests run with no network; `full` also launches a throwaway
      # stack on an internal-only network, and model tests skip on CI.
      - name: Verify (full)
        run: ./scripts/verify.sh full
