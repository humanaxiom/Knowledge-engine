name: CI

on:
  # ci-triggers (ADR-KE-015): push runs only for the default branch, and
  # every pull request gets one run, so a PR push is verified once. A
  # branch with no open PR gets no CI. Renaming the default branch must
  # update this list and DEFAULT_BRANCH in tests/test_stack_ready_docs.py.
  push:
    branches: [ccr-19465ed4-j1u0m5]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 69  # A74 (human ruling 2026-10-28, Q74): 69 min; PR #15 run 40628987168 verify job 35m53s on a GitHub-hosted runner at a 2.13x noisy-neighbour factor; docs/evidence/platform-sbom/u8/ci-timing-q74.md
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The same entry point as local and agent runs: it builds the `gates`
      # image. Unit tests run with no network; `full` also launches a throwaway
      # stack on an internal-only network, and model tests skip on CI.
      - name: Verify (full)
        run: ./scripts/verify.sh full
