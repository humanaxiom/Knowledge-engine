name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The same entry point as local and agent runs: it builds the `gates`
      # image and runs every gate inside it with networking disabled.
      - name: Verify (full)
        run: ./scripts/verify.sh full
