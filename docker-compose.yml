# The Knowledge Engine stack (architecture §2.1, §2.4). Services without a
# profile are the stack; `scripts/launch.sh` brings them up. Gate services are
# profile-only one-shots, run only through `scripts/verify.sh`.
#
# Ports: only the gateway publishes, on KE_BIND_ADDRESS (loopback by default).
# Every variable default written with :- equals its value in .env.example.
name: knowledge-engine

x-app: &app
  image: ke-app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  restart: unless-stopped
  networks: [backend]
  environment:
    KE_ENV: ${KE_ENV}
    KE_BIND_ADDRESS: ${KE_BIND_ADDRESS:-127.0.0.1}
    KE_AUTH__ENABLED: ${KE_AUTH__ENABLED:-false}
    KE_API__LISTEN_PORT: ${KE_API_LISTEN:-8080}
    KE_MODEL_UPSTREAM: ${KE_MODEL_UPSTREAM:-}
    KE_EGRESS_ALLOWLIST: ${KE_EGRESS_ALLOWLIST:-}
    KE_STORES__POSTGRES__PASSWORD: ${KE_STORES__POSTGRES__PASSWORD}
    KE_STORES__NEO4J__PASSWORD: ${KE_STORES__NEO4J__PASSWORD}
    HARNESS_TRACING: ${HARNESS_TRACING:-otlp}

x-gates: &gates
  image: ke-gates
  build:
    context: .
    dockerfile: docker/gates.Dockerfile
  working_dir: /work
  volumes:
    - .:/work

services:
  gateway:
    image: ke-gateway
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    restart: unless-stopped
    networks: [edge, backend]
    ports:
      - target: ${KE_GATEWAY_API_LISTEN:-8100}
        host_ip: ${KE_BIND_ADDRESS:-127.0.0.1}
        published: ${KE_API_PORT:-47100}
        protocol: tcp
      - target: ${KE_GATEWAY_PHOENIX_LISTEN:-8101}
        host_ip: ${KE_BIND_ADDRESS:-127.0.0.1}
        published: ${KE_PHOENIX_PORT:-47101}
        protocol: tcp
    environment:
      KE_ENV: ${KE_ENV}
      KE_BIND_ADDRESS: ${KE_BIND_ADDRESS:-127.0.0.1}
      KE_GATEWAY_API_LISTEN: ${KE_GATEWAY_API_LISTEN:-8100}
      KE_GATEWAY_PHOENIX_LISTEN: ${KE_GATEWAY_PHOENIX_LISTEN:-8101}
      KE_GATEWAY_MODEL_LISTEN: ${KE_GATEWAY_MODEL_LISTEN:-8102}
      KE_API__LISTEN_PORT: ${KE_API_LISTEN:-8080}
      KE_MODEL_UPSTREAM: ${KE_MODEL_UPSTREAM:-}
      KE_EGRESS_ALLOWLIST: ${KE_EGRESS_ALLOWLIST:-}
      PHOENIX_PORT: ${PHOENIX_PORT:-6006}
    healthcheck:
      # The gateway's own route: it must be healthy without api or phoenix.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${KE_GATEWAY_API_LISTEN}/_gateway/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    <<: *app
    command: ["python", "-m", "engine.api"]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      valkey: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; from engine.config import Settings as S; u.urlopen(f'http://127.0.0.1:{S().api.listen_port}/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # Placeholder until platform-stack-ready (PS-2.6) adds the RQ worker: the
  # same image, idle and healthy, so the topology is final.
  worker:
    <<: *app
    command: ["python", "-m", "engine.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import engine"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: engine
      POSTGRES_DB: engine
      POSTGRES_PASSWORD: ${KE_STORES__POSTGRES__PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community@sha256:0a6e7aedf54a531f76286032d4365ead65b11cca05e4a15cdf23b8e53d6db02b
    restart: unless-stopped
    networks: [backend]
    environment:
      NEO4J_AUTH: neo4j/${KE_STORES__NEO4J__PASSWORD}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  valkey:
    image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    restart: unless-stopped
    networks: [backend]
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  phoenix:
    image: arizephoenix/phoenix:version-20.22.0@sha256:fa28e9cd96dd554a63ff9bf55ca40799d470ec75bdd7dd85a2dee97b9e8c704c
    restart: unless-stopped
    networks: [backend]
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_PORT: ${PHOENIX_PORT:-6006}
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - phoenix-data:/mnt/data
    healthcheck:
      # The image has no shell or curl; it ships python.
      test: ["CMD", "/usr/bin/python3.13", "-c", "import os, urllib.request as u; u.urlopen('http://127.0.0.1:%s/healthz' % os.environ['PHOENIX_PORT'], timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot unit-gate runner (`verify.sh fast`): no network at all.
  gates:
    <<: *gates
    profiles: ["gates"]
    network_mode: none

  # One-shot gate runner for `verify.sh full`: on the internal backend network
  # only, with no Docker socket (ADR-KE-009, F-A). Reaches the real stores and
  # the gateway; its only way off the machine is the gateway's model forward.
  gates-it:
    <<: *gates
    profiles: ["gates-it"]
    networks: [backend]
    environment:
      KE_GATEWAY_MODEL_LISTEN: ${KE_GATEWAY_MODEL_LISTEN:-8102}
      KE_API__LISTEN_PORT: ${KE_API_LISTEN:-8080}

networks:
  # The only network with a route out; only the gateway joins it.
  edge: {}
  # No route out: every other service, and gates-it, live here.
  backend:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated

volumes:
  phoenix-data:
  postgres-data:
  neo4j-data:
  valkey-data:
