# Local Arize Phoenix: UI + OTLP/HTTP collector on one published port, set by
# KE_PHOENIX_PORT in .env (see .env.example). OTLP/gRPC is not published.
services:
  phoenix:
    image: arizephoenix/phoenix:version-20.22.0
    ports:
      - "127.0.0.1:${KE_PHOENIX_PORT:-47101}:${PHOENIX_PORT:-6006}"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_PORT: ${PHOENIX_PORT:-6006}
    volumes:
      - phoenix-data:/mnt/data

  # One-shot gate runner; invoked only through `scripts/verify.sh`.
  # No network: gates must never reach a model host or the internet.
  gates:
    profiles: ["gates"]
    build:
      context: .
      dockerfile: docker/gates.Dockerfile
    network_mode: none
    working_dir: /work
    volumes:
      - .:/work

volumes:
  phoenix-data:
