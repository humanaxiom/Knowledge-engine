# Gateway: the only stack service with a route out (architecture §2.1, §2.4).
# Upstreams are variables resolved per request/connection, so nginx starts and
# serves the other routes when any upstream (api, phoenix, the model host) is
# absent. Server blocks come from the envsubst templates in /etc/nginx/templates.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream-conf.d/*.conf;
}
