[project]
name = "knowledge-engine"
version = "0.1.0"
description = "Multi-agent development harness with OpenInference tracing for Arize Phoenix"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "openinference-semantic-conventions>=0.1.41",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "harness_telemetry"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "mypy>=2.4.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.coverage.run]
branch = true
source = ["engine", "harness_telemetry"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.mypy]
strict = true
files = ["engine", "harness_telemetry"]
plugins = ["pydantic.mypy"]
